<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONG - Amor de 4 patas</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="feedback.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@100..800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>
<body>
  <section class="feedback-demo">
  <h2>Feedbacks</h2>

  <div class="feedback feedback-success">
    <strong>Sucesso</strong>
    <span>Cadastro realizado com sucesso.</span>
  </div>

  <div class="feedback feedback-error">
    <strong>Erro</strong>
    <span>Não foi possível realizar o cadastro.</span>
  </div>

  <div class="feedback feedback-warning">
    <strong>Atenção</strong>
    <span>Existem campos obrigatórios não preenchidos.</span>
  </div>

  <div class="toast feedback-success">
    <span>Alterações salvas com sucesso.</span>
  </div>
</section>
</body>
</html>
